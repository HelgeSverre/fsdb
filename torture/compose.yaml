services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: torture-secret
    ports:
      - "127.0.0.1::3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=torture-secret mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 1s
      timeout: 3s
      retries: 90

volumes:
  mysql-data:
