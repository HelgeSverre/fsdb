name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check release version
        shell: bash
        run: |
          git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "Release tag $RELEASE_TAG does not exist" >&2
            exit 1
          }
          version="$(dotnet msbuild src/Fsdb/Fsdb.fsproj -getProperty:Version)"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          }

      - name: Build and test
        env:
          DOTNET_GCHeapHardLimit: '0x100000000'
        run: |
          dotnet build Fsdb.slnx -c Release --nologo
          dotnet run --project tests/Fsdb.Tests -c Release --no-build -- --sequenced --no-spinner

      - name: Verify package consumer
        run: bash scripts/verify-package.sh

      - name: Pack release artifacts
        run: dotnet pack src/Fsdb/Fsdb.fsproj -c Release --nologo -o artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: helgesverre

      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/Fsdb.${RELEASE_TAG#v}.nupkg" --source https://api.nuget.org/v3/index.json
