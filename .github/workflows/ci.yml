name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Fsdb.slnx -c Release --nologo
      - name: Test
        run: dotnet run --project tests/Fsdb.Tests -c Release --no-build -- --no-spinner
      - name: Verify package consumer
        run: bash scripts/verify-package.sh

  branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Branch coverage
        run: |
          dotnet tool restore
          dotnet build tests/Fsdb.Tests -c Debug --nologo
          dotnet tool run coverlet tests/Fsdb.Tests/bin/Debug/net10.0/Fsdb.Tests.dll \
            -t dotnet \
            -a tests/Fsdb.Tests/bin/Debug/net10.0/Fsdb.Tests.dll \
            --include '[Fsdb]*' \
            -f cobertura \
            -o coverage/coverage \
            --threshold 65 \
            --threshold-type branch \
            --threshold-stat total
