name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Fsdb.slnx -c Release --nologo
      - name: Verify package consumer
        run: bash scripts/verify-package.sh

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run regression suite
        run: dotnet run --project tests/Fsdb.Tests -c Release -- --no-spinner

  branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Branch coverage
        run: |
          (while sleep 10; do
            echo "Coverage runner resources at $(date -u +%H:%M:%S):"
            free -m
            ps -eo pid,rss,pcpu,comm --sort=-rss | head -8
          done) &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true' EXIT
          dotnet tool restore
          dotnet build tests/Fsdb.Tests -c Debug --nologo
          dotnet tool run coverlet tests/Fsdb.Tests/bin/Debug/net10.0/Fsdb.Tests.dll \
            -t dotnet \
            -a 'tests/Fsdb.Tests/bin/Debug/net10.0/Fsdb.Tests.dll --parallel-workers 2 --no-spinner' \
            --include '[Fsdb]*' \
            -f cobertura \
            -o coverage/coverage \
            --threshold 65 \
            --threshold-type branch \
            --threshold-stat total
